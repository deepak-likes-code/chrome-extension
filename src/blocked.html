<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by FocusTab</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: radial-gradient(circle at 50% 15%, #284c41 0, #13241f 34%, #09100e 80%);
        color: #ffffff;
      }
      .message {
        text-align: center;
        padding: 2.5rem;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.13);
        backdrop-filter: blur(22px);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        max-width: 460px;
        width: 90%;
      }
      h1 {
        margin: 0 0 1rem 0;
        font-size: 2rem;
        font-weight: 600;
        color: #ffffff;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 1.1rem;
        color: #b3b3b3;
        line-height: 1.5;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: #7ee2b8;
      }
      strong { color: #9ce9c8; }
      .actions { display:flex; gap:.75rem; justify-content:center; }
      button { border:0; border-radius:12px; padding:.8rem 1rem; font-weight:600; cursor:pointer; }
      #go-back { background:#7ee2b8; color:#0c2119; }
      #allow-once { background:rgba(255,255,255,.1); color:white; border:1px solid rgba(255,255,255,.12); }
      button:disabled { opacity:.55; cursor:default; }
      .note { margin-top:1rem; font-size:.78rem; color:#82938d; }
    </style>
  </head>
  <body>
    <div class="message">
      <div class="icon">🎯</div>
      <h1>Stay with the work.</h1>
      <p><strong id="blocked-domain">This site</strong> is on your Focus blocklist. Your browser is keeping the promise you made to yourself.</p>
      <div class="actions">
        <button id="go-back">Go back</button>
        <button id="allow-once">Open for 5 minutes</button>
      </div>
      <div class="note">This attempt is counted privately on this device.</div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
